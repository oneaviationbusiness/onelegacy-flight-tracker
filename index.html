<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLA Unified Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
}

/* TOP BAR */
#topbar {
  position: absolute;
  top: 10px;
  left: 60px;
  z-index: 99999;

  display: flex;
  gap: 10px;
}

.btn {
  border: none;
  border-radius: 12px;

  padding: 10px 14px;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;

  background: rgba(20,20,20,0.82);
  color: white;

  backdrop-filter: blur(10px);
}

/* CARD */
#card {
  position: absolute;
  top: 20px;
  right: 20px;

  width: 330px;

  z-index: 99999;

  border-radius: 20px;

  padding: 18px;

  background: rgba(10,15,20,0.9);
  color: white;

  backdrop-filter: blur(14px);

  box-shadow: 0 0 30px rgba(0,0,0,0.35);

  display: none;
}

.callsign {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 12px;
}

.network {
  display: inline-block;

  padding: 6px 12px;

  border-radius: 999px;

  font-size: 13px;

  margin-bottom: 16px;
}

.vatsim {
  background: #000;
  color: white;
}

.volanta {
  background: #2196f3;
  color: white;
}

.row {
  margin: 8px 0;
  font-size: 14px;
}

.aircraft-wrapper {
  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.aircraft-icon {
  width: 32px;
  height: 32px;

  filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
}
</style>
</head>

<body>

<div id="topbar">
  <button class="btn" id="themeBtn">
    Light Mode
  </button>
</div>

<div id="card"></div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* MAP */
const map = L.map('map').setView([20, 0], 2);

/* THEMES */
const darkMap = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  { maxZoom: 19 }
);

const lightMap = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19 }
);

darkMap.addTo(map);

let darkMode = true;

/* THEME */
document.getElementById("themeBtn").onclick = () => {

  if (darkMode) {

    map.removeLayer(darkMap);
    lightMap.addTo(map);

    document.getElementById("themeBtn").innerText =
      "Dark Mode";

    darkMode = false;

  } else {

    map.removeLayer(lightMap);
    darkMap.addTo(map);

    document.getElementById("themeBtn").innerText =
      "Light Mode";

    darkMode = true;
  }
};

/* STORAGE */
const aircraft = {};
let selected = null;

/* ICON */
function createPlaneIcon(color, heading = 0) {

  return L.divIcon({

    className: '',

    html: `
      <div
      class="aircraft-wrapper"
      style="transform: rotate(${heading}deg);">

      <svg
      class="aircraft-icon"
      viewBox="0 0 512 512"
      xmlns="http://www.w3.org/2000/svg">

      <path
      fill="${color}"
      d="
      M256 0
      L330 180
      L512 256
      L330 300
      L256 512
      L182 300
      L0 256
      L182 180
      Z
      "/>

      </svg>

      </div>
    `,

    iconSize: [34,34],
    iconAnchor: [17,17]
  });
}

/* CARD */
function updateCard(a) {

  const p = a.data;

  const networkClass =
    a.network === "VOLANTA"
    ? "volanta"
    : "vatsim";

  document.getElementById("card").style.display =
    "block";

  document.getElementById("card").innerHTML = `

    <div class="callsign">
      ${p.callsign}
    </div>

    <div class="network ${networkClass}">
      ${a.network}
    </div>

    <div class="row">
      <b>Altitude:</b>
      ${Math.round(p.altitude)} ft
    </div>

    <div class="row">
      <b>Speed:</b>
      ${Math.round(p.groundspeed)} kt
    </div>

    <div class="row">
      <b>Heading:</b>
      ${Math.round(p.heading)}°
    </div>

    <div class="row">
      <b>Latitude:</b>
      ${p.latitude.toFixed(3)}
    </div>

    <div class="row">
      <b>Longitude:</b>
      ${p.longitude.toFixed(3)}
    </div>
  `;
}

/* SMOOTH */
function animateAircraft(a) {

  function tick() {

    a.currentLat +=
      (a.targetLat - a.currentLat) * 0.03;

    a.currentLng +=
      (a.targetLng - a.currentLng) * 0.03;

    a.marker.setLatLng([
      a.currentLat,
      a.currentLng
    ]);

    requestAnimationFrame(tick);
  }

  tick();
}

/* ADD AIRCRAFT */
function addAircraft(p, network, color) {

  const id =
    network + "_" + p.callsign;

  if (!aircraft[id]) {

    const marker = L.marker(
      [p.latitude, p.longitude],
      {
        icon: createPlaneIcon(
          color,
          p.heading
        )
      }
    ).addTo(map);

    const trail = L.polyline(
      [[p.latitude, p.longitude]],
      {
        color,
        weight: 2
      }
    ).addTo(map);

    aircraft[id] = {

      marker,
      trail,

      currentLat: p.latitude,
      currentLng: p.longitude,

      targetLat: p.latitude,
      targetLng: p.longitude,

      history: [[p.latitude, p.longitude]],

      data: p,

      network
    };

    animateAircraft(aircraft[id]);

    marker.on("click", () => {

      selected = id;

      updateCard(aircraft[id]);
    });

  } else {

    const a = aircraft[id];

    a.data = p;

    a.targetLat = p.latitude;
    a.targetLng = p.longitude;

    a.marker.setIcon(
      createPlaneIcon(color, p.heading)
    );

    a.history.push([
      p.latitude,
      p.longitude
    ]);

    a.trail.setLatLngs(a.history);

    if (selected === id) {
      updateCard(a);
    }
  }
}

/* VATSIM */
async function fetchVatsim() {

  try {

    const res = await fetch(
      "https://data.vatsim.net/v3/vatsim-data.json"
    );

    const data = await res.json();

    const pilots = data.pilots.filter(p =>
      p.callsign &&
      p.callsign.includes("OLA")
    );

    pilots.forEach(p => {

      addAircraft(
        {
          callsign: p.callsign,
          latitude: p.latitude,
          longitude: p.longitude,
          altitude: p.altitude,
          groundspeed: p.groundspeed,
          heading: p.heading
        },
        "VATSIM",
        "black"
      );

    });

  } catch(err) {
    console.log("VATSIM ERROR", err);
  }
}

/* VOLANTA */
/*
IMPORTANT:

THIS IS AN EXPERIMENTAL ATTEMPT.

Volanta does NOT provide
a documented public live API.

This endpoint may NOT work,
may require auth,
or may change anytime.

But you asked to try it.
*/

async function fetchVolanta() {

  try {

    const res = await fetch(
      "https://api.volanta.app/public/flights"
    );

    const data = await res.json();

    const flights = data.filter(f =>
      f.callsign &&
      f.callsign.includes("OLA")
    );

    flights.forEach(f => {

      addAircraft(
        {
          callsign: f.callsign,
          latitude: f.latitude,
          longitude: f.longitude,
          altitude: f.altitude,
          groundspeed: f.groundspeed,
          heading: f.heading
        },
        "VOLANTA",
        "#2196f3"
      );

    });

  } catch(err) {

    console.log(
      "VOLANTA endpoint unavailable",
      err
    );
  }
}

/* START */
fetchVatsim();
fetchVolanta();

setInterval(fetchVatsim, 2000);
setInterval(fetchVolanta, 2000);

</script>

</body>
</html>
