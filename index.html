<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OLA Live Flight Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: 0.3s;
  }

  /* THEMES */
  body.dark {
    background: #07121c;
    color: white;
  }

  body.light {
    background: #f2f2f2;
    color: black;
  }

  #map {
    height: 100vh;
    width: 100%;
  }

  /* BUTTON */
  #toggle {
    position: absolute;
    z-index: 9999;
    top: 10px;
    left: 10px;
    padding: 10px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
  }

  /* FLIGHT CARD */
  #card {
    position: absolute;
    top: 60px;
    right: 10px;
    width: 260px;
    padding: 15px;
    border-radius: 10px;
    background: rgba(0,0,0,0.85);
    color: white;
    display: none;
    z-index: 9999;
  }

  body.light #card {
    background: white;
    color: black;
  }

  .title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .row {
    margin: 5px 0;
    font-size: 13px;
  }

  .plane-icon {
    font-size: 18px;
    text-align: center;
  }
</style>
</head>

<body class="dark">

<button id="toggle">Toggle Theme</button>

<div id="card"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18
}).addTo(map);

let aircraft = {};
let selected = null;

/* THEME TOGGLE */
document.getElementById("toggle").onclick = () => {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
};

/* AIRCRAFT ICON */
function makeIcon() {
  return L.divIcon({
    className: "",
    html: `<div class="plane-icon">✈️</div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });
}

/* FLIGHT CARD */
function showCard(data) {
  const card = document.getElementById("card");
  card.style.display = "block";

  card.innerHTML = `
    <div class="title">${data.callsign}</div>
    <div class="row">Pilot ID: ${data.cid}</div>
    <div class="row">Altitude: ${data.altitude} ft</div>
    <div class="row">Speed: ${data.groundspeed} kt</div>
    <div class="row">Lat: ${data.latitude}</div>
    <div class="row">Lon: ${data.longitude}</div>
  `;
}

/* SMOOTH MOVE */
function lerp(a, b, t) {
  return a + (b - a) * t;
}

/* FETCH DATA */
async function fetchData() {
  const res = await fetch("https://data.vatsim.net/v3/vatsim-data.json");
  const data = await res.json();

  const pilots = data.pilots.filter(p =>
    p.callsign?.includes("OLA") &&
    p.latitude && p.longitude
  );

  pilots.forEach(p => {
    if (!aircraft[p.cid]) {
      const marker = L.marker([p.latitude, p.longitude], {
        icon: makeIcon()
      }).addTo(map);

      marker.on("click", () => {
        selected = p.cid;
        showCard(p);
      });

      aircraft[p.cid] = {
        marker,
        lat: p.latitude,
        lng: p.longitude,
        targetLat: p.latitude,
        targetLng: p.longitude,
        history: [[p.latitude, p.longitude]],
        polyline: L.polyline([], { color: "red" }).addTo(map)
      };
    } else {
      aircraft[p.cid].targetLat = p.latitude;
      aircraft[p.cid].targetLng = p.longitude;

      aircraft[p.cid].data = p;

      // store trail
      aircraft[p.cid].history.push([p.latitude, p.longitude]);
      if (aircraft[p.cid].history.length > 20) {
        aircraft[p.cid].history.shift();
      }
    }
  });
}

/* ANIMATION LOOP */
function animate() {
  Object.values(aircraft).forEach(a => {
    a.lat = lerp(a.lat, a.targetLat, 0.08);
    a.lng = lerp(a.lng, a.targetLng, 0.08);

    a.marker.setLatLng([a.lat, a.lng]);
    a.polyline.setLatLngs(a.history);

    if (selected && a.data?.cid === selected) {
      showCard(a.data);
    }
  });

  requestAnimationFrame(animate);
}

/* START */
fetchData();
setInterval(fetchData, 15000);
animate();
</script>

</body>
</html>
