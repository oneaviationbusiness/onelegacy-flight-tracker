<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OLA Flight Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
  body {
    margin: 0;
    background: #0b1d2a;
    font-family: Arial, sans-serif;
  }

  #map {
    height: 100vh;
    width: 100%;
  }

  .popup {
    font-size: 13px;
    line-height: 1.4;
  }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  // Create map
  const map = L.map('map').setView([20, 0], 2);

  // OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  let markers = [];

  async function loadFlights() {
    try {
      const res = await fetch("https://data.vatsim.net/v3/vatsim-data.json");
      const data = await res.json();

      const pilots = data.pilots || [];

      // Clear old markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      // Filter OLA callsigns
      const olaFlights = pilots.filter(p =>
        p.callsign && p.callsign.includes("OLA") &&
        p.latitude && p.longitude
      );

      olaFlights.forEach(p => {
        const marker = L.circleMarker([p.latitude, p.longitude], {
          radius: 6,
          color: "red",
          fillOpacity: 0.8
        }).addTo(map);

        marker.bindPopup(`
          <div class="popup">
            <b>Callsign:</b> ${p.callsign}<br>
            <b>Pilot ID:</b> ${p.cid}<br>
            <b>Altitude:</b> ${p.altitude} ft<br>
            <b>Speed:</b> ${p.groundspeed} kt<br>
            <b>Lat:</b> ${p.latitude}<br>
            <b>Lon:</b> ${p.longitude}
          </div>
        `);

        markers.push(marker);
      });

    } catch (err) {
      console.log("Error loading VATSIM data", err);
    }
  }

  loadFlights();
  setInterval(loadFlights, 15000);
</script>

</body>
</html>
