<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OLA Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* THEMES */
body.dark {
  background: #08131d;
  color: white;
}

body.light {
  background: #f5f5f5;
  color: black;
}

#map {
  width: 100%;
  height: 100%;
}

/* THEME BUTTON */
#themeBtn {
  position: absolute;
  top: 80px;
  left: 10px;
  z-index: 9999;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  background: rgba(20,20,20,0.9);
  color: white;
}

body.light #themeBtn {
  background: white;
  color: black;
}

/* FLIGHT CARD */
#card {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 300px;
  z-index: 9999;

  border-radius: 18px;
  padding: 18px;

  backdrop-filter: blur(12px);

  background: rgba(10,15,20,0.88);
  color: white;

  display: none;

  box-shadow: 0 0 25px rgba(0,0,0,0.4);
}

body.light #card {
  background: rgba(255,255,255,0.92);
  color: black;
}

.callsign {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 10px;
}

.status {
  padding: 6px 10px;
  border-radius: 999px;
  display: inline-block;
  margin-bottom: 15px;
  font-size: 13px;
  background: #1f7ae0;
}

.row {
  margin: 7px 0;
  font-size: 14px;
}

/* AIRCRAFT ICON */
.aircraft-icon {
  width: 28px;
  height: 28px;
  transform-origin: center;
}
</style>
</head>

<body class="dark">

<button id="themeBtn">Light Mode</button>

<div id="card"></div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* MAP */
const map = L.map('map', {
  zoomControl: true
}).setView([20, 0], 2);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 18
  }
).addTo(map);

/* THEME */
const btn = document.getElementById("themeBtn");

btn.onclick = () => {
  if (document.body.classList.contains("dark")) {
    document.body.classList.remove("dark");
    document.body.classList.add("light");
    btn.innerText = "Dark Mode";
  } else {
    document.body.classList.remove("light");
    document.body.classList.add("dark");
    btn.innerText = "Light Mode";
  }
};

/* STORAGE */
const aircraft = {};
let selectedCid = null;

/* BETTER AIRCRAFT SVG */
function createAircraftIcon(heading = 0) {
  return L.divIcon({
    className: '',
    html: `
      <svg class="aircraft-icon"
      style="transform: rotate(${heading}deg);"
      viewBox="0 0 24 24">

      <path fill="white"
      stroke="black"
      stroke-width="0.5"
      d="
      M12 2
      L15 10
      L22 12
      L15 14
      L12 22
      L9 14
      L2 12
      L9 10 Z"/>
      </svg>
    `,
    iconSize: [28, 28],
    iconAnchor: [14, 14]
  });
}

/* STATUS DETECTION */
function getStatus(p) {
  const alt = p.altitude;
  const gs = p.groundspeed;

  if (gs < 30) return "Boarding";
  if (alt < 3000 && gs > 50) return "Takeoff";
  if (alt > 3000 && alt < 28000) return "Climbing";
  if (alt >= 28000) return "Cruise";
  if (alt < 10000 && gs > 150) return "Descending";
  if (alt < 3000 && gs < 180) return "Landing";

  return "Flying";
}

/* CARD */
function showCard(p) {
  const card = document.getElementById("card");

  card.style.display = "block";

  card.innerHTML = `
    <div class="callsign">${p.callsign}</div>

    <div class="status">${getStatus(p)}</div>

    <div class="row"><b>Pilot ID:</b> ${p.cid}</div>
    <div class="row"><b>Altitude:</b> ${p.altitude} ft</div>
    <div class="row"><b>Ground Speed:</b> ${p.groundspeed} kt</div>
    <div class="row"><b>Heading:</b> ${Math.round(p.heading)}°</div>
    <div class="row"><b>Latitude:</b> ${p.latitude.toFixed(3)}</div>
    <div class="row"><b>Longitude:</b> ${p.longitude.toFixed(3)}</div>
  `;
}

/* SMOOTH MOVE */
function smoothMove(obj) {
  obj.currentLat += (obj.targetLat - obj.currentLat) * 0.08;
  obj.currentLng += (obj.targetLng - obj.currentLng) * 0.08;

  obj.marker.setLatLng([obj.currentLat, obj.currentLng]);

  requestAnimationFrame(() => smoothMove(obj));
}

/* FETCH */
async function fetchFlights() {

  const res = await fetch(
    "https://data.vatsim.net/v3/vatsim-data.json"
  );

  const data = await res.json();

  const pilots = data.pilots.filter(p =>
    p.callsign &&
    p.callsign.includes("OLA") &&
    p.latitude &&
    p.longitude
  );

  pilots.forEach(p => {

    /* NEW AIRCRAFT */
    if (!aircraft[p.cid]) {

      const marker = L.marker(
        [p.latitude, p.longitude],
        {
          icon: createAircraftIcon(p.heading)
        }
      ).addTo(map);

      /* FLIGHT TRAIL */
      const trail = L.polyline(
        [[p.latitude, p.longitude]],
        {
          color: "#42a5f5",
          weight: 2
        }
      ).addTo(map);

      aircraft[p.cid] = {
        marker,
        trail,
        currentLat: p.latitude,
        currentLng: p.longitude,
        targetLat: p.latitude,
        targetLng: p.longitude,
        history: [[p.latitude, p.longitude]],
        data: p
      };

      smoothMove(aircraft[p.cid]);

      marker.on("click", () => {
        selectedCid = p.cid;
        showCard(aircraft[p.cid].data);
      });

    } else {

      const a = aircraft[p.cid];

      a.targetLat = p.latitude;
      a.targetLng = p.longitude;
      a.data = p;

      /* ROTATE ICON */
      a.marker.setIcon(
        createAircraftIcon(p.heading)
      );

      /* SAVE TRAIL */
      a.history.push([p.latitude, p.longitude]);

      a.trail.setLatLngs(a.history);

      /* LIVE CARD UPDATE */
      if (selectedCid === p.cid) {
        showCard(p);
      }
    }

  });
}

/* START */
fetchFlights();
setInterval(fetchFlights, 5000);

</script>

</body>
</html>
