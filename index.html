<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OLA Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* MAP */
#map {
  width: 100%;
  height: 100%;
}

/* THEME BUTTON */
#themeBtn {
  position: absolute;
  top: 80px;
  left: 10px;
  z-index: 99999;

  border: none;
  border-radius: 12px;

  padding: 12px 16px;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;

  backdrop-filter: blur(12px);

  background: rgba(20,20,20,0.8);
  color: white;
}

/* FLIGHT CARD */
#card {
  position: absolute;
  top: 20px;
  right: 20px;

  width: 320px;

  z-index: 99999;

  border-radius: 20px;

  padding: 18px;

  backdrop-filter: blur(14px);

  background: rgba(10,15,20,0.88);

  color: white;

  display: none;

  box-shadow: 0 0 25px rgba(0,0,0,0.35);
}

.callsign {
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 12px;
}

.status {
  display: inline-block;

  background: #2196f3;

  padding: 6px 12px;

  border-radius: 999px;

  font-size: 13px;

  margin-bottom: 14px;
}

.row {
  margin: 8px 0;
  font-size: 14px;
}

.aircraft-wrapper {
  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.aircraft-svg {
  width: 32px;
  height: 32px;

  filter: drop-shadow(0 0 3px rgba(0,0,0,0.5));
}
</style>
</head>

<body>

<button id="themeBtn">Light Mode</button>

<div id="card"></div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* MAP */
const map = L.map('map', {
  zoomControl: true
}).setView([20, 0], 2);

/* MAP THEMES */
const darkMap = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 19
  }
);

const lightMap = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }
);

darkMap.addTo(map);

let darkMode = true;

/* THEME BUTTON */
const themeBtn = document.getElementById("themeBtn");

themeBtn.onclick = () => {

  if (darkMode) {

    map.removeLayer(darkMap);
    lightMap.addTo(map);

    document.getElementById("card").style.background =
      "rgba(255,255,255,0.92)";
    document.getElementById("card").style.color = "black";

    themeBtn.style.background = "white";
    themeBtn.style.color = "black";

    themeBtn.innerText = "Dark Mode";

    darkMode = false;

  } else {

    map.removeLayer(lightMap);
    darkMap.addTo(map);

    document.getElementById("card").style.background =
      "rgba(10,15,20,0.88)";
    document.getElementById("card").style.color = "white";

    themeBtn.style.background = "rgba(20,20,20,0.8)";
    themeBtn.style.color = "white";

    themeBtn.innerText = "Light Mode";

    darkMode = true;
  }
};

/* STORAGE */
const aircraft = {};
let selected = null;

/* AIRCRAFT ICON */
function createPlaneIcon(heading = 0) {

  return L.divIcon({

    className: '',

    html: `
      <div
        class="aircraft-wrapper"
        style="transform: rotate(${heading}deg);"
      >

      <svg
        class="aircraft-svg"
        viewBox="0 0 512 512"
        xmlns="http://www.w3.org/2000/svg">

        <path
          fill="white"
          stroke="black"
          stroke-width="10"

          d="
          M256 0
          L320 180
          L500 220
          L320 260
          L256 512
          L192 260
          L12 220
          L192 180
          Z
          "/>

      </svg>

      </div>
    `,

    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });
}

/* STATUS */
function getStatus(p) {

  const alt = p.altitude;
  const gs = p.groundspeed;

  if (gs < 30) return "Boarding";
  if (alt < 3000 && gs > 50) return "Takeoff";
  if (alt > 3000 && alt < 28000) return "Climbing";
  if (alt >= 28000) return "Cruise";
  if (alt < 10000 && gs > 150) return "Descending";
  if (alt < 3000 && gs < 180) return "Landing";

  return "Flying";
}

/* FLIGHT CARD */
function updateCard(p) {

  const card = document.getElementById("card");

  card.style.display = "block";

  card.innerHTML = `

    <div class="callsign">
      ${p.callsign}
    </div>

    <div class="status">
      ${getStatus(p)}
    </div>

    <div class="row">
      <b>Pilot ID:</b> ${p.cid}
    </div>

    <div class="row">
      <b>Altitude:</b> ${p.altitude} ft
    </div>

    <div class="row">
      <b>Ground Speed:</b> ${p.groundspeed} kt
    </div>

    <div class="row">
      <b>Heading:</b> ${Math.round(p.heading)}°
    </div>

    <div class="row">
      <b>Latitude:</b> ${p.latitude.toFixed(3)}
    </div>

    <div class="row">
      <b>Longitude:</b> ${p.longitude.toFixed(3)}
    </div>
  `;
}

/* SMOOTH MOVEMENT */
function animateAircraft(a) {

  a.currentLat +=
    (a.targetLat - a.currentLat) * 0.03;

  a.currentLng +=
    (a.targetLng - a.currentLng) * 0.03;

  a.marker.setLatLng([
    a.currentLat,
    a.currentLng
  ]);

  requestAnimationFrame(() => animateAircraft(a));
}

/* FETCH VATSIM */
async function fetchFlights() {

  try {

    const res = await fetch(
      "https://data.vatsim.net/v3/vatsim-data.json"
    );

    const data = await res.json();

    const pilots = data.pilots.filter(p =>
      p.callsign &&
      p.callsign.includes("OLA") &&
      p.latitude &&
      p.longitude
    );

    pilots.forEach(p => {

      /* NEW AIRCRAFT */
      if (!aircraft[p.cid]) {

        const marker = L.marker(
          [p.latitude, p.longitude],
          {
            icon: createPlaneIcon(p.heading)
          }
        ).addTo(map);

        const trail = L.polyline(
          [[p.latitude, p.longitude]],
          {
            color: "#42a5f5",
            weight: 2
          }
        ).addTo(map);

        aircraft[p.cid] = {

          marker,
          trail,

          currentLat: p.latitude,
          currentLng: p.longitude,

          targetLat: p.latitude,
          targetLng: p.longitude,

          history: [[p.latitude, p.longitude]],

          data: p
        };

        animateAircraft(aircraft[p.cid]);

        marker.on("click", () => {
          selected = p.cid;
          updateCard(aircraft[p.cid].data);
        });

      } else {

        const a = aircraft[p.cid];

        a.targetLat = p.latitude;
        a.targetLng = p.longitude;

        a.data = p;

        /* ROTATE AIRCRAFT */
        a.marker.setIcon(
          createPlaneIcon(p.heading)
        );

        /* SAVE FULL TRAIL */
        a.history.push([
          p.latitude,
          p.longitude
        ]);

        a.trail.setLatLngs(a.history);

        /* LIVE CARD UPDATE */
        if (selected === p.cid) {
          updateCard(p);
        }
      }

    });

  } catch(err) {
    console.log(err);
  }
}

/* START */
fetchFlights();

/* FAST REFRESH */
setInterval(fetchFlights, 2000);

</script>

</body>
</html>
