<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLA Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
}

#themeBtn {
  position: absolute;
  top: 80px;
  left: 10px;
  z-index: 99999;

  border: none;
  border-radius: 14px;

  padding: 12px 16px;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;

  backdrop-filter: blur(10px);

  background: rgba(20,20,20,0.85);
  color: white;
}

#card {
  position: absolute;
  top: 20px;
  right: 20px;

  width: 330px;

  z-index: 99999;

  border-radius: 20px;

  padding: 20px;

  background: rgba(12,16,22,0.88);
  color: white;

  backdrop-filter: blur(16px);

  box-shadow: 0 0 30px rgba(0,0,0,0.35);

  display: none;
}

.callsign {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 12px;
}

.phase {
  display: inline-block;

  background: #1f8fff;

  padding: 7px 14px;

  border-radius: 999px;

  font-size: 13px;

  margin-bottom: 16px;
}

.row {
  margin: 8px 0;
  font-size: 14px;
}

.aircraft-wrapper {
  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.aircraft-icon {
  width: 32px;
  height: 32px;

  filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
}

.leaflet-control-zoom {
  margin-top: 10px !important;
}
</style>
</head>

<body>

<button id="themeBtn">Light Mode</button>

<div id="card"></div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* MAP */
const map = L.map('map', {
  zoomControl: true
}).setView([20, 0], 2);

/* THEMES */
const darkMap = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {
    maxZoom: 19
  }
);

const lightMap = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19
  }
);

let darkMode = true;

darkMap.addTo(map);

/* THEME BUTTON */
const themeBtn = document.getElementById("themeBtn");

const card = document.getElementById("card");

themeBtn.onclick = () => {

  if (darkMode) {

    map.removeLayer(darkMap);
    lightMap.addTo(map);

    themeBtn.innerText = "Dark Mode";

    themeBtn.style.background = "white";
    themeBtn.style.color = "black";

    card.style.background = "rgba(255,255,255,0.92)";
    card.style.color = "black";

    darkMode = false;

  } else {

    map.removeLayer(lightMap);
    darkMap.addTo(map);

    themeBtn.innerText = "Light Mode";

    themeBtn.style.background = "rgba(20,20,20,0.85)";
    themeBtn.style.color = "white";

    card.style.background = "rgba(12,16,22,0.88)";
    card.style.color = "white";

    darkMode = true;
  }
};

/* STORAGE */
const aircraft = {};
let selectedAircraft = null;

/* ICON */
function createPlaneIcon(heading = 0) {

  return L.divIcon({

    className: '',

    html: `
      <div
      class="aircraft-wrapper"
      style="transform: rotate(${heading}deg);">

      <svg
      class="aircraft-icon"
      viewBox="0 0 512 512"
      xmlns="http://www.w3.org/2000/svg">

      <path
      fill="white"
      d="
      M256 0
      L330 180
      L512 256
      L330 300
      L256 512
      L182 300
      L0 256
      L182 180
      Z
      "/>

      </svg>

      </div>
    `,

    iconSize: [34,34],
    iconAnchor: [17,17]
  });
}

/* FLIGHT PHASES */
function getFlightPhase(a) {

  const gs = a.data.groundspeed;
  const alt = a.data.altitude;

  if (!a.cruiseAltitude) {
    a.cruiseAltitude = alt;
  }

  if (alt > a.cruiseAltitude) {
    a.cruiseAltitude = alt;
  }

  if (gs <= 5 && alt < 100) {
    return "Boarding";
  }

  if (gs > 5 && gs < 40 && alt < 1000) {
    return "Taxi";
  }

  if (gs >= 40 && alt < 4000) {
    return "Takeoff";
  }

  if (alt >= 4000 && alt < a.cruiseAltitude - 1000) {
    return "Climb";
  }

  if (
    alt >= a.cruiseAltitude - 1000 &&
    alt <= a.cruiseAltitude + 1000 &&
    a.cruiseAltitude > 10000
  ) {
    return "Cruise";
  }

  if (alt <= a.cruiseAltitude - 8000 && alt > 10000) {
    return "Descent";
  }

  if (alt <= 10000 && alt > 4000) {
    return "Approach";
  }

  if (alt <= 4000 && gs > 60) {
    return "Landing";
  }

  if (gs <= 60 && alt < 1000) {
    return "Landed";
  }

  return "Flying";
}

/* CARD */
function updateCard(a) {

  const p = a.data;

  card.style.display = "block";

  card.innerHTML = `

    <div class="callsign">
      ${p.callsign}
    </div>

    <div class="phase">
      ${getFlightPhase(a)}
    </div>

    <div class="row"><b>Pilot ID:</b> ${p.cid}</div>

    <div class="row"><b>Altitude:</b> ${p.altitude.toLocaleString()} ft</div>

    <div class="row"><b>Ground Speed:</b> ${p.groundspeed} kt</div>

    <div class="row"><b>Heading:</b> ${Math.round(p.heading)}°</div>

    <div class="row"><b>Latitude:</b> ${p.latitude.toFixed(3)}</div>

    <div class="row"><b>Longitude:</b> ${p.longitude.toFixed(3)}</div>

    <div class="row"><b>Cruise Alt:</b> ${Math.round(a.cruiseAltitude).toLocaleString()} ft</div>
  `;
}

/* PREDICTED MOVEMENT */
function animateAircraft(a) {

  function tick() {

    /* PREDICT MOVEMENT */
    const speed = a.data.groundspeed || 0;
    const heading = (a.data.heading || 0) * Math.PI / 180;

    const distancePerFrame = speed * 0.0000008;

    a.targetLat += Math.cos(heading) * distancePerFrame;
    a.targetLng += Math.sin(heading) * distancePerFrame;

    a.currentLat += (a.targetLat - a.currentLat) * 0.03;
    a.currentLng += (a.targetLng - a.currentLng) * 0.03;

    a.marker.setLatLng([
      a.currentLat,
      a.currentLng
    ]);

    requestAnimationFrame(tick);
  }

  tick();
}

/* FETCH */
async function fetchFlights() {

  try {

    const res = await fetch(
      "https://data.vatsim.net/v3/vatsim-data.json"
    );

    const data = await res.json();

    const pilots = data.pilots.filter(p =>
      p.callsign &&
      p.callsign.includes("OLA") &&
      p.latitude &&
      p.longitude
    );

    pilots.forEach(p => {

      if (!aircraft[p.cid]) {

        const marker = L.marker(
          [p.latitude, p.longitude],
          {
            icon: createPlaneIcon(p.heading)
          }
        ).addTo(map);

        const trail = L.polyline(
          [[p.latitude, p.longitude]],
          {
            color: '#42a5f5',
            weight: 2
          }
        ).addTo(map);

        aircraft[p.cid] = {

          marker,
          trail,

          currentLat: p.latitude,
          currentLng: p.longitude,

          targetLat: p.latitude,
          targetLng: p.longitude,

          history: [[p.latitude, p.longitude]],

          data: p,

          cruiseAltitude: p.altitude
        };

        animateAircraft(aircraft[p.cid]);

        marker.on('click', () => {

          selectedAircraft = p.cid;

          updateCard(aircraft[p.cid]);
        });

      } else {

        const a = aircraft[p.cid];

        a.data = p;

        a.targetLat = p.latitude;
        a.targetLng = p.longitude;

        a.marker.setIcon(
          createPlaneIcon(p.heading)
        );

        a.history.push([
          p.latitude,
          p.longitude
        ]);

        a.trail.setLatLngs(a.history);

        if (selectedAircraft === p.cid) {
          updateCard(a);
        }
      }
    });

  } catch(err) {
    console.log(err);
  }
}

/* START */
fetchFlights();

/* FASTEST SAFE REFRESH */
setInterval(fetchFlights, 1000);

</script>

</body>
</html>
